name: export-recent

on:
  workflow_dispatch:          # 분석이 필요할 때만 수동 실행

permissions:
  contents: write

concurrency:
  group: sake-watch
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Export recent products
        run: python3 export_recent.py
      - name: Save
        run: |
          git config user.name "sake-watch-bot"
          git config user.email "sake-watch-bot@users.noreply.github.com"
          git add recent_products.json
          git diff --cached --quiet && exit 0
          git commit -m "export recent products"
          git pull --rebase -q origin main
          git push
