name: sake-watch

on:
  schedule:
    - cron: "3-59/10 * * * *"   # 10분마다 (GitHub 사정에 따라 몇 분 늦어질 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write             # state.json 저장용

concurrency:
  group: sake-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check shops
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          NOTIFY_SOLDOUT_NEW: ${{ vars.NOTIFY_SOLDOUT_NEW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 sake_watch.py

      - name: Save state
        run: |
          git config user.name "sake-watch-bot"
          git config user.email "sake-watch-bot@users.noreply.github.com"
          git add state.json
          if [ -f history.csv ]; then git add history.csv; fi
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          git pull --rebase -q origin main
          git push
