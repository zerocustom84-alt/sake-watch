name: sake-watch

# 한 번 실행되면 약 5시간 반 동안 켜진 채로 1분마다 확인한다.
# 끝나기 10분 전에 다음 회차를 스스로 요청하고, 예비로 watchdog 이 매시간 살펴본다.
on:
  workflow_dispatch:

permissions:
  contents: write   # state.json / history.csv 저장
  actions: write    # 다음 회차 요청

concurrency:
  group: sake-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Watch shops
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          NOTIFY_SOLDOUT_NEW: ${{ vars.NOTIFY_SOLDOUT_NEW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "sake-watch-bot"
          git config user.email "sake-watch-bot@users.noreply.github.com"
          python3 sake_watch.py
